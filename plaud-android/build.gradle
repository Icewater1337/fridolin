plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}

// Fridolin's dashboard builds into its own data folder (-PfridolinBuildDir), out of the checkout.
if (findProperty('fridolinBuildDir')) {
    allprojects { layout.buildDirectory = file("${rootProject.property('fridolinBuildDir')}/${project.name}") }
}
