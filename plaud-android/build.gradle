// The Android Gradle plugin (9 and later) compiles Kotlin itself ("built-in Kotlin"), with the
// Kotlin Gradle plugin it depends on; the classpath line takes a newer one than that.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

plugins {
    id 'com.android.application' version '9.5.0' apply false
}

// Fridolin's dashboard builds into its own data folder (-PfridolinBuildDir), out of the checkout.
if (findProperty('fridolinBuildDir')) {
    allprojects { layout.buildDirectory = file("${rootProject.property('fridolinBuildDir')}/${project.name}") }
}
