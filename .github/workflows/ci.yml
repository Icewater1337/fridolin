name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

  scripts:
    # Pinned rather than ubuntu-latest: Python 3.9 is past its end of life,
    # and setup-python only has builds of it for the images that exist now,
    # so the next ubuntu-latest would break this job with no change here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck --severity=warning setup.sh scripts/*.sh .githooks/*

      # The oldest Python the README promises (and the one macOS ships as
      # /usr/bin/python3), so a newer-only feature fails here first.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: python syntax
        run: |
          python3 -m py_compile tools/*.py tools/tests/*.py

      - name: python tests
        run: python3 -m unittest discover -s tools/tests -v

  personal-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nothing published here may contain a real phone number, WhatsApp JID,
      # email address, home path or token. Contributors run the same check as a
      # pre-push hook (scripts/install-hooks.sh); this catches anyone who didn't.
      - name: no personal data in new commits
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          scripts/check-personal-data.sh --range "$BEFORE..HEAD"
