name: CI

on:
  push:
    branches: [main, claude/throwaway-227]
  pull_request:

# The jobs only read the repository; nothing here needs to write to it.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
# Every other run (each push to main) gets a group of its own, so none is
# cancelled or left waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA, which unlike a tag cannot be moved
# to other code; the comment names the release. Dependabot proposes updates,
# and scripts/check-action-pins.sh (make lint-actions) fails on a tag.

jobs:
  fuzz:
    # After a merge only: twenty seconds a target would hold up every pull
    # request, and the failing inputs committed under testdata/fuzz already
    # run there as part of go test.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # go test fuzzes one target of one package at a time, so each target
      # in turn, found by name: a new one needs no change here. The list is
      # taken first, so a test binary that does not build fails the step
      # instead of leaving nothing to fuzz. A short -fuzzminimizetime keeps
      # the engine from spending a target's twenty seconds shrinking one new
      # input (60 seconds each by default).
      - name: fuzz each target for 20 seconds
        run: |
          failed=""
          for pkg in $(go list ./internal/throwaway227); do
            list=$(go test -list '^Fuzz' "$pkg") || exit 1
            targets=$(printf '%s\n' "$list" | grep '^Fuzz' || true)
            [ -n "$targets" ] || continue
            # The tests link testdata in their working directory to the
            # package's (linkTestdata), and the engine saves a failing input
            # there: without the directory the link dangles, and the input
            # would only be in the log.
            mkdir -p "$(go list -f '{{.Dir}}' "$pkg")/testdata"
            for target in $targets; do
              echo "::group::$target ($pkg)"
              if ! go test -run='^$' -fuzz="^${target}\$" -fuzztime=20s -fuzzminimizetime=5s "$pkg"; then
                failed="$failed $target"
              fi
              echo "::endgroup::"
            done
          done
          if [ -n "$failed" ]; then
            echo "::error::fuzzing found a failing input for:$failed"
            exit 1
          fi

      # The engine saves a failing input under testdata/fuzz/<target> in the
      # package. Commit it with the fix, and go test runs it from then on.
      # The artifact holds every package's testdata/fuzz, the inputs
      # committed before included. go.mod is there to root the artifact at
      # the repository: its paths start at the common folder of what it
      # holds, and the report job finds a package's input at its path.
      - name: keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failing-inputs
          path: |
            go.mod
            **/testdata/fuzz/**
          retention-days: 30

  # A run on main reports itself in issues (scripts/ci-report.sh): one per
  # failing fuzz target or test, which a later run that passes closes.
  # Nobody watches main's runs, and a failure after a merge shows in no
  # pull request. Pushes to main of this repository only, so the write
  # permission is never in a run a pull request or a fork started. It runs
  # after every other job, also when they all passed, so it can close; a
  # job added to this workflow goes into needs too.
  report:
    needs: [fuzz]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/claude/throwaway-227' && github.repository == 'Icewater1337/fridolin' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the run's jobs, their logs and the fuzz artifact
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: report in issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          SELF_JOB: report
          BRANCH: claude/throwaway-227
        run: scripts/ci-report.sh

