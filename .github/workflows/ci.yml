name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS and Windows, and the Python and shell tests there, run weekly
  # and on demand (Actions → CI → Run workflow) rather than on each pull
  # request or push: their runner minutes cost the most. Pull requests test
  # the current Go release on Linux; pushes to main test both.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

# The jobs only read the repository; nothing here needs to write to it.
permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
# Every other run (each push to main) gets a group of its own, so none is
# cancelled or left waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA, which unlike a tag cannot be moved
# to other code; the comment names the release. Renovate proposes updates,
# and scripts/check-action-pins.sh (make lint-actions) fails on a tag.

jobs:
  # Linux runs every test: the core runs in the Linux container, so this is
  # the bridge as it runs. macOS and Windows test what differs there
  # (go-macos, go-windows), and the whole macOS suite runs nightly
  # (macos-full.yml).
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # The two Go releases that still get security fixes: the previous
        # one and the current one, which release builds use. oldstable is
        # meant to match the go directive in go.mod. When a new release
        # moves oldstable on, raise the directive to it: CI no longer tests
        # the old minimum, and go.mod and setup.sh, which reads it, would
        # still accept a release without security fixes.
        go: [oldstable, stable]
        # The slowest job is what a pull request waits for, so the race
        # tests run in slices, one job each (scripts/test-shard.sh, which
        # runs a slice's packages side by side). Each slice then takes
        # about as long as internal/app's share of it. The checks that run
        # once per release are go-checks, beside them, but for the two that
        # build with -race.
        shard: [1, 2]
        # A pull request tests the current release; main tests both.
        exclude:
          - go: ${{ github.event_name == 'pull_request' && 'oldstable' || 'none' }}
    name: go (${{ matrix.os }}, ${{ matrix.go }}, ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Test the release setup-go installed. With the default (auto), a go
      # directive newer than it would quietly download a newer toolchain.
      GOTOOLCHAIN: local
      # How many slices the race tests run in; see shard above.
      SHARDS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go keys its cache on the system, the release and a hash of
      # cache-dependency-path (go.sum by default), and the first job to
      # finish with a key saves it for every run after, until the hash
      # changes. These slices build every package with -race, which the
      # jobs that build without it (site, CodeQL) would leave out of the
      # cache, so they hash other files and have a cache of their own;
      # go-checks too. A cache is about 0.4 GB, of the repository's 10.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum

      # The backup tests that run the real rclone skip without it. Linux
      # gets a pinned release, checked against its published checksum
      # (Ubuntu's own package is years older), and FRIDOLIN_REQUIRE_RCLONE
      # makes those tests fail rather than skip. The variables must not
      # start with RCLONE_: rclone reads every RCLONE_* variable as one of
      # its flags, and RCLONE_VERSION would become --version.
      - name: install rclone
        env:
          PINNED_RCLONE_VERSION: v1.73.3
          PINNED_RCLONE_SHA256: 70278c22b98c7d02aed01828b70053904dbce4c8a1a15d7781d836c6fdb036ea
        run: |
          cd "$RUNNER_TEMP"
          name="rclone-$PINNED_RCLONE_VERSION-linux-amd64"
          curl -fsSLo rclone.zip "https://downloads.rclone.org/$PINNED_RCLONE_VERSION/$name.zip"
          echo "$PINNED_RCLONE_SHA256  rclone.zip" | sha256sum -c -
          unzip -q rclone.zip
          sudo install -m 0755 "$name/rclone" /usr/local/bin/rclone
          rclone version
          echo "FRIDOLIN_REQUIRE_RCLONE=1" >> "$GITHUB_ENV"

      # The steps are Makefile targets, so `make check` runs the same.
      - name: test
        run: make race-shard SHARD=${{ matrix.shard }}/${{ env.SHARDS }}

      # These two build with -race too, so they run where that build is in
      # the cache: a few seconds each, after one of the slices.
      - name: repeat provider process tests
        if: matrix.shard == fromJSON(env.SHARDS)
        run: make race-process

      # Builds the binary with -race in a temp dir, starts it in dev mode on
      # a scratch config and stops it.
      - name: smoke test
        if: matrix.shard == fromJSON(env.SHARDS)
        run: make smoke

  # What runs once per release, beside the test slices instead of after one
  # of them, but for the -race steps above. Vet and the linters cover the
  # files of macOS and Windows from here too (GOOS), so the macOS runners,
  # of which GitHub gives an account only a few at a time, only test. The
  # steps are Makefile targets, so `make check` runs the same.
  go-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: [oldstable, stable]
        exclude:
          - go: ${{ github.event_name == 'pull_request' && 'oldstable' || 'none' }}
    name: go checks (${{ matrix.os }}, ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A cache of its own (see go): it builds without -race, for Linux and
      # Windows too.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            Makefile

      - name: gofmt
        run: make fmt-check

      # Natively, and for Linux, macOS and Windows without cgo.
      - name: go vet
        run: make vet

      - name: build
        run: make build

      # The main package is in cmd/fridolin. An old `go build -o fridolin .`
      # at the root must fail rather than write something over the binary.
      - name: no Go files at the root
        run: make root-check

      # The linters need one Go release, but Linux's files and macOS's:
      # some only build on one of them.
      - name: staticcheck and exhaustive
        if: matrix.go == 'stable'
        run: make lint-go

      - name: staticcheck and exhaustive for macOS
        if: matrix.go == 'stable'
        run: make lint-go-os LINT_GOOS=darwin

      # What go-macos and go-windows test (scripts/os-tests.sh): a package
      # .github/os-specific-packages.txt names must still exist.
      - name: the OS-specific tests
        if: matrix.go == 'stable'
        run: |
          scripts/os-tests.sh --goos darwin --list
          scripts/os-tests.sh --goos windows --list

      - name: go.mod and go.sum are tidy
        if: matrix.go == 'stable'
        run: make tidy-check

      # It lists what every release platform links, so one run covers
      # them all. A dependency update fails here until make notices ran.
      - name: THIRD_PARTY_NOTICES is current
        if: matrix.go == 'stable'
        run: make notices-check

      - name: actionlint and action pins
        if: matrix.go == 'stable'
        run: make lint-actions

  # macOS tests what differs there from Linux (scripts/os-tests.sh): the
  # packages built from other files for darwin, the tests in files with a
  # build constraint, and what .github/os-specific-packages.txt adds (the
  # host CLI, Keychain, launchd, the node agent, the sandbox-exec profiles).
  # Then it starts the bridge in dev mode. Vet and lint of its files run on
  # Linux (go-checks); the whole suite runs nightly (macos-full.yml).
  go-macos:
    strategy:
      fail-fast: false
      matrix:
        go: [oldstable, stable]
        # GitHub runs only a few macOS jobs at a time per account, so a
        # pull request tests macOS on the current release alone; each
        # push to main tests both. "none" matches no release.
    name: go (macos-latest, ${{ matrix.go }})
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A cache of its own (see go): what it builds with -race.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: |
            go.sum
            .github/os-specific-packages.txt

      - name: build every package
        run: go build ./...

      - name: the OS-specific tests
        run: make os-tests

      - name: smoke test
        run: make smoke

  # Windows builds everything and vets it, and runs the tests that differ
  # there (scripts/os-tests.sh): the bridge (the core) runs there in the
  # Linux container (docs/CORE.md), so only the node agent and the libraries
  # under it run natively (docs/DECISIONS.md), and
  # .github/os-specific-packages.txt lists those whose tests pass on
  # Windows. No race detector (it needs cgo there) and none of the
  # POSIX-shell targets.
  go-windows:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: go vet
        run: go vet ./...
      - name: build
        run: go build -o bin/fridolin.exe ./cmd/fridolin
      - name: test
        run: scripts/os-tests.sh -count=1 -short

  fuzz:
    # After a merge only: twenty seconds a target would hold up every pull
    # request, and the failing inputs committed under testdata/fuzz already
    # run there as part of go test.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      # fuzz-short (Makefile) fuzzes each target in turn, found by name, so
      # a new one needs no change here. It goes on past a target that fails,
      # and fails at the end.
      - name: fuzz each target for 20 seconds
        run: make fuzz-short FUZZTIME=20s

      # The engine saves a failing input under testdata/fuzz/<target> in the
      # package. Commit it with the fix, and go test runs it from then on.
      # The artifact holds every package's testdata/fuzz, the inputs
      # committed before included. go.mod is there to root the artifact at
      # the repository: its paths start at the common folder of what it
      # holds, and the report job finds a package's input at its path.
      - name: keep the failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failing-inputs
          path: |
            go.mod
            **/testdata/fuzz/**
          retention-days: 30

  # A run on main reports itself in issues (scripts/ci-report.sh): one per
  # failing fuzz target or test, which a later run that passes closes.
  # Nobody watches main's runs, and a failure after a merge shows in no
  # pull request. Pushes to main of this repository only, so the write
  # permission is never in a run a pull request or a fork started. It runs
  # after every other job, also when they all passed, so it can close; a
  # job added to this workflow goes into needs too (scripts/test-ci-report.sh
  # fails until it does).
  report:
    needs: [go, go-checks, go-macos, go-windows, fuzz, scripts, python, web, site, personal-data]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the run's jobs, their logs and the fuzz artifact
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: report in issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          SELF_JOB: report
        run: scripts/ci-report.sh

  scripts:
    # The git hooks run the personal-data check on macOS, with BSD awk,
    # grep and sed; CI's own scan runs it on Linux with GNU's. Its tests
    # run on both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        exclude:
          - os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'none' || 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Once is enough: shellcheck reports the same on both.
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: make lint-sh

      - name: tests of the personal-data, action-pin, notices, release and CI report scripts and the Makefile
        run: make test-sh

  python:
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the README promises, so a newer-only feature
        # fails here first, and the newest release, so something it
        # removed fails too, both on Ubuntu 24.04 rather than ubuntu-latest:
        # Python 3.9 is past its end of life, and setup-python only has
        # builds of it for the images that exist now. And macOS's own
        # /usr/bin/python3 ("system"), which brains run the tools with, and
        # the one system with sandbox-exec, which a test needs: weekly.
        python: ['3.9', '3.x', system]
        exclude:
          - python: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'none' || 'system' }}
    runs-on: ${{ matrix.python == 'system' && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.python != 'system'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # Once is enough: ruff reports the same on every Python.
      - name: ruff
        if: matrix.python == '3.9'
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
          make lint-py

      - name: python syntax and tests
        run: make test-py PYTHON="${{ matrix.python == 'system' && '/usr/bin/python3' || 'python3' }}"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Every dashboard module must parse: one syntax error leaves the whole
      # dashboard blank. node --test then runs web/test (web/**/*.test.js).
      - name: dashboard modules and unit tests
        run: make test-web

      # ESLint at the version the Makefile pins, which npx fetches.
      - name: ESLint
        run: make lint-web

      # TypeScript's checker on the JSDoc types, at the pinned version.
      - name: tsc
        run: make typecheck-web

  site:
    # The site process (site/, docs/SITE.md): its own tests, then the Go
    # end-to-end tests that run it, which skip without its node_modules.
    # On macOS too, where the live site runs under its sandbox.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        exclude:
          - os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'none' || 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: install
        working-directory: site
        run: npm ci

      - name: typecheck
        working-directory: site
        run: npx tsc --noEmit

      - name: test
        working-directory: site
        run: npm test

      - name: Go end-to-end tests of the site
        run: go test -count=1 -run 'TestSite|TestBuilder' ./internal/app

  personal-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Nothing published here may contain a real phone number, WhatsApp JID,
      # email address, home path or token. Contributors run the same check as a
      # pre-push hook (scripts/install-hooks.sh); this catches anyone who didn't.
      - name: no personal data in new commits
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a usable base, check everything after the root commit.
          # Not the root commit itself: it predates this check, and what the
          # check flags in it was removed later (published history stays).
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            BEFORE="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          scripts/check-personal-data.sh --range "$BEFORE..HEAD"
