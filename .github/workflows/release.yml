name: release

# Pushing a tag such as v1.2.3 builds the bridge for macOS and Linux and
# publishes the archives, with their SHA256SUMS, as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Actions are pinned to a commit, so a tag moved upstream cannot change
# what builds and publishes a release.
jobs:
  build:
    strategy:
      matrix:
        # SQLite needs cgo, so each OS builds on its own runner: macOS for
        # both architectures, Linux natively on each. test is false where
        # the runner cannot run the binaries it builds. The Linux builds
        # link against the runner's glibc and need that release or newer,
        # so they use the oldest Ubuntu runners there are (glibc 2.35).
        include:
          - { runner: macos-latest, goos: darwin, goarch: arm64, test: true }
          - { runner: macos-latest, goos: darwin, goarch: amd64, test: false }
          - { runner: ubuntu-22.04, goos: linux, goarch: amd64, test: true }
          - { runner: ubuntu-22.04-arm, goos: linux, goarch: arm64, test: true }
    runs-on: ${{ matrix.runner }}
    env:
      # Build with the release setup-go installed, as CI tests it.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: test
        if: matrix.test
        run: go test -count=1 ./...

      # Each archive carries THIRD_PARTY_NOTICES, which must list what
      # this build links.
      - name: THIRD_PARTY_NOTICES is current
        run: scripts/third-party-notices.sh --check

      - name: build
        env:
          GOOS_TARGET: ${{ matrix.goos }}
          GOARCH_TARGET: ${{ matrix.goarch }}
        run: scripts/build-release.sh "$GITHUB_REF_NAME" "$GOOS_TARGET" "$GOARCH_TARGET" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fridolin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only this job writes: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
