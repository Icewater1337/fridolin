name: Image

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - container/**
      - cmd/**
      - internal/**
      - web/**
      - tools/**
      - go.mod
      - go.sum
      - .dockerignore
      - .github/workflows/image.yml

# Read only by default; the jobs that publish ask for more themselves, and
# only run on a push to main.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Builds the core's image (container/Dockerfile), the box's FrIDE image
# (container/fride/Dockerfile) and the FrIDE instances' sbx template
# (container/sandbox/fride.Dockerfile) for both architectures fridolin
# runs on, so a change that breaks one fails here. On main it publishes
# them to GHCR, as one multi-arch image each, tagged with the version
# `fridolin version` reports (git describe --tags --always --abbrev=8),
# with build provenance from GitHub's attestations and an SBOM. Machines
# pull the core's and the box's by digest and check the provenance before
# they run one (docs/CORE.md, "On GHCR"); sbx pulls the template on a node
# that builds none (docs/NODES.md, "FrIDE instances"), by the tag the
# core's image names: a hash of what goes into the template, so that a
# core of a new version names the same template while that is the same,
# and no instance is made anew for nothing. The registry is the
# repository owner's (ghcr.io/<owner>), so a fork publishes to its own.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      registry: ${{ steps.v.outputs.registry }}
      sandbox_tag: ${{ steps.v.outputs.sandbox_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The version a build of this commit reports, as the Makefile and
      # setup.sh stamp it; core start and box updates look for this tag.
      # GHCR's names are lower case. The template's own tag hashes its
      # Dockerfile (which pins FrIDE, Claude Code, ponytail and the base),
      # the FrIDE config it copies and FrIDE's URL.
      - id: v
        env:
          FRIDE_REPO: ${{ github.server_url }}/${{ github.repository_owner }}/fride
        run: |
          echo "version=$(git describe --tags --always --abbrev=8)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          sum=$({ cat container/sandbox/fride.Dockerfile; printf '\0'; cat container/fride/companion.json; printf '\0%s' "$FRIDE_REPO"; } | sha256sum)
          echo "sandbox_tag=t-${sum:0:12}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        image: [fridolin-core, fridolin-fride, fridolin-fride-sandbox]
        platform: [linux/amd64, linux/arm64]
        include:
          - { image: fridolin-core, dockerfile: container/Dockerfile }
          - { image: fridolin-fride, dockerfile: container/fride/Dockerfile }
          - { image: fridolin-fride-sandbox, dockerfile: container/sandbox/fride.Dockerfile }
        # A pull request builds for amd64 alone; main builds both, which
        # the published multi-arch image needs.
        exclude:
          - platform: ${{ github.event_name == 'pull_request' && 'linux/arm64' || 'none' }}
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REGISTRY: ${{ needs.version.outputs.registry }}
      # Where the FrIDE image and the template get FrIDE, and the FrIDE
      # image its starter repositories; the core's image names the
      # template's tag.
      BUILD_ARGS: |
        VERSION=${{ needs.version.outputs.version }}
        FRIDOLIN_REPO=${{ github.server_url }}/${{ github.repository }}
        FRIDE_REPO=${{ github.server_url }}/${{ github.repository_owner }}/fride
        FRIDOLIN_BOX_SOURCE=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        FRIDOLIN_BOX_REGISTRY=${{ needs.version.outputs.registry }}
        FRIDOLIN_FRIDE_SANDBOX_TAG=${{ needs.version.outputs.sandbox_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The amd64 runner of a private repository fills its disk while the
      # core image builds the node binaries; its toolchains are unused here.
      - name: free disk space
        if: matrix.platform == 'linux/amd64'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ env.BUILD_ARGS }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
      - name: the binary and the tools answer
        if: matrix.image == 'fridolin-core'
        run: |
          docker run --rm --entrypoint /usr/local/bin/fridolin fridolin-core:ci version
          docker run --rm --entrypoint sh fridolin-core:ci -c 'claude --version && codex --version && restic version && rclone version | head -1 && litestream version && bwrap --version && gh --version | head -1'
          # The builds nodes are updated to, of the image's version.
          docker run --rm --entrypoint sh fridolin-core:ci -c 'grep -q "\"version\": \"'"$VERSION"'\"" /opt/fridolin/node-binaries/manifest.json && ls -l /opt/fridolin/node-binaries'
      - name: FrIDE and its tools answer
        if: matrix.image == 'fridolin-fride'
        env:
          PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          docker run --rm --entrypoint sh fridolin-fride:ci -c 'test -x /opt/fride/bin/fride && claude --version && gh --version | head -1 && go version && node --version && git --version && socat -V | head -1 && test -f /opt/fride/plugins/ponytail/README.md'
          # FrIDE starts with the box's config, its config check passes,
          # and it answers on the port the node's agent reaches it at.
          docker run -d --name fride-ci -e FRIDOLIN_NODE_HOST=127.0.0.1 fridolin-fride:ci
          for _ in $(seq 1 30); do
            docker exec fride-ci curl -fsS -o /dev/null http://127.0.0.1:17840/ && break
            sleep 2
          done
          # The starter repositories are cloned without credentials, which
          # a private repository refuses; its config then names a repository
          # the box does not have, so only a public one checks the config.
          if [ "$PRIVATE_REPO" != true ]; then docker exec fride-ci fride config check; fi
          docker exec fride-ci curl -fsS -o /dev/null http://127.0.0.1:17840/
          docker exec fride-ci sh -c 'curl -fsS -o /dev/null "http://$(hostname -i | cut -d" " -f1):17840/" -H "Host: 127.0.0.1:17840"'
          docker rm -f fride-ci
      - name: the template's FrIDE and tools answer
        if: matrix.image == 'fridolin-fride-sandbox'
        run: |
          # As the sandbox's user, with what the node's scripts in the VM
          # use (fride_instance_scripts.go) and the FrIDE config a new
          # instance starts from; Claude Code never updates itself.
          docker run --rm --entrypoint sh fridolin-fride-sandbox:ci -c 'test "$(id -un)" = agent && test "$DISABLE_AUTOUPDATER" = 1 && test -x /opt/fride/bin/fride && claude --version && go version && node --version && gh --version | head -1 && git --version && command -v socat jq lsof setsid ip && jq -e ".companion.enabled" /opt/fride/companion.json && test -f /opt/fride/plugins/ponytail/.claude-plugin/plugin.json'

      # On main: the same build again, pushed by digest (the layers come
      # from the cache of the build above), with an SBOM and buildx's own
      # provenance; the merge job tags the multi-arch image.
      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ env.BUILD_ARGS }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: keep the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      # Named architecture first: a pattern that ends in the image's name
      # takes fridolin-fride's alone, not fridolin-fride-sandbox's too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: digests-${{ matrix.platform == 'linux/arm64' && 'arm64' || 'amd64' }}-${{ matrix.image }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push'
    needs: [version, build]
    strategy:
      matrix:
        image: [fridolin-core, fridolin-fride, fridolin-fride-sandbox]
    runs-on: ubuntu-latest
    # Writes the package, and signs its provenance with the workflow's
    # identity (Sigstore, through GitHub's attestations).
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.registry }}/${{ matrix.image }}
      # The template is tagged with its own tag too, which the core names.
      OWN_TAG: ${{ matrix.image == 'fridolin-fride-sandbox' && needs.version.outputs.sandbox_tag || '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digests-*-${{ matrix.image }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: the multi-arch image, tagged with the version
        id: index
        working-directory: digests
        run: |
          refs=()
          for d in *; do refs+=("$IMAGE@sha256:$d"); done
          tags=(-t "$IMAGE:$VERSION" -t "$IMAGE:main")
          if [ -n "$OWN_TAG" ]; then tags+=(-t "$IMAGE:$OWN_TAG"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION is $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
