name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  # New advisories are published without any change here, so scan main
  # once a week as well.
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

# As in ci.yml: a new push to a pull request cancels the old run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fails when the code reaches a known vulnerability in a dependency
      # or in the standard library. stable is the toolchain release builds
      # use, so standard-library findings match what actually ships.
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          go-package: ./...
