# Weekly update pull requests. Minor and patch releases of an ecosystem come
# grouped in one pull request; a major release comes on its own, so a
# breaking change gets reviewed by itself. A release has to be a week old
# before it is proposed, which keeps a hijacked release that is yanked
# within days out of the proposals.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # tailscale.com v1.104 needs Go 1.27.1 (its go directive), but go.mod
      # stays at oldstable, Go 1.26, which CI tests and the core image
      # builds with (ci.yml, container/Dockerfile). Drop this once Go 1.28
      # is out and oldstable, and the directive, move to 1.27.
      - dependency-name: tailscale.com
        versions: [">= 1.104.0"]

  # The actions the workflows pin by commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # tools/requirements*.txt. Their ">=" floors are deliberate (the oldest
  # release each feature was checked with), and their "<" ceilings the next
  # major release, so a range only moves when a new release falls outside
  # it; exact pins (ruff) move with every release.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
