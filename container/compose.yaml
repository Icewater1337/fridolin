# The fridolin core: one container and one named volume (docs/CORE.md).
#
# `fridolin core start` runs this file with the secrets from the host's
# keychain in the environment of `docker compose` only; the names below
# without a value take theirs from there. Run by hand, the same works with
# the variables exported in your shell:
#
#     docker compose -f container/compose.yaml up -d
#
# The volume holds the WhatsApp session: never run a second core on it,
# and never remove it (docker compose down -v) without an export.
name: fridolin

services:
  core:
    image: ${FRIDOLIN_IMAGE:-fridolin-core}:${FRIDOLIN_VERSION:-latest}
    container_name: fridolin-core
    hostname: fridolin-core
    restart: unless-stopped
    init: false # tini is the image's PID 1
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
      - FRIDOLIN_AGE_IDENTITY_PQ
      - FRIDOLIN_AGE_IDENTITY
      - FRIDOLIN_EXPORT_KEY
      - TS_AUTHKEY
      - B2_VAULT_KEY_ID
      - B2_VAULT_KEY
      - B2_SNAPSHOTS_KEY_ID
      - B2_SNAPSHOTS_KEY
      - FRIDOLIN_VAULT_CRYPT_PASSWORD
      - FRIDOLIN_VAULT_CRYPT_PASSWORD2
      - FRIDOLIN_VAULT_SEAL_KEY
      - RESTIC_PASSWORD
      - FRIDOLIN_SNAPSHOTS_CRYPT_PASSWORD
      - FRIDOLIN_LITESTREAM_SEAL_KEY
      - TZ=${FRIDOLIN_TZ:-UTC}
    volumes:
      - fridolin-data:/data
    mem_limit: ${FRIDOLIN_MEMORY_LIMIT:-8g}
    # Least privilege for the bridge, which runs as uid 10001 and needs no
    # capability. Each brain's run is sandboxed with bubblewrap in user,
    # mount and PID namespaces of its own: seccomp.json (beside this file)
    # is Docker's default profile with those namespaces allowed, and
    # systempaths=unconfined lets bubblewrap mount a fresh /proc for the
    # run, which Docker's masked /proc paths forbid. On a host with
    # AppArmor (Ubuntu), Docker's docker-default profile also forbids the
    # mounts: add apparmor=unconfined here (docs/CORE.md).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=${FRIDOLIN_SECCOMP:-./seccomp.json}
      - systempaths=unconfined
    # The dashboard and local APIs on this machine only. The tailnet
    # (tsnet, `core.tailnet`) is the way in from anywhere else; delete
    # this mapping to leave that the only one. Both sides are http_listen's
    # port: the dashboard accepts only requests addressed to it.
    # The site (docs/SITE.md) is published the same way, at the port of its
    # default listen address: a Cloudflare tunnel on the host points its
    # public host name at http://127.0.0.1:8780. Keep the site's listen port
    # and this mapping the same (docs/CORE.md, "The site").
    ports:
      - "127.0.0.1:8765:8765"
      - "127.0.0.1:8780:8780"
    stop_grace_period: 30s

volumes:
  fridolin-data:
    name: ${FRIDOLIN_VOLUME:-fridolin-data}
